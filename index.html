
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mercure Signature</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<table class="signature" cellpadding="0" cellspacing="0" border="0">
<tr>
<!-- LEFT -->

<td class="left">
<div class="name" id="sig-name"></div>

<div class="text" id="sig-title"></div>

<div class="text" id="sig-hotel"></div>

<div class="text" id="sig-address"></div>

<div class="text" id="sig-city"></div>

<div class="text" id="sig-phone"></div>

<a class="email"
id="sig-email">
</a>

<div class="logo">

<a href="https://mercure-solo.com">

<img
src="https://mercure-solo.com/signateur/assets/ico/all.png"
alt="ALL">

</a>

</div>

<table
class="social"
cellpadding="0"
cellspacing="0"
border="0">

<tr>

<td>

<a href="https://www.facebook.com/Mercurehotels">

<img
src="https://mercure-solo.com/signateur/assets/ico/fb.png"
alt="Facebook">

</a>

</td>

<td>

<a href="https://www.instagram.com/mercuresolo">

<img
src="https://mercure-solo.com/signateur/assets/ico/ig.png"
alt="Instagram">

</a>

</td>

<td>

<a href="https://www.linkedin.com/company/mercure-hotel/">

<img
src="https://mercure-solo.com/signateur/assets/ico/in.png"
alt="LinkedIn">

</a>

</td>

<td>

<a href="https://www.youtube.com/user/Mercurehotels">

<img
src="https://mercure-solo.com/signateur/assets/ico/yt.png"
alt="YouTube">

</a>

</td>

</tr>

</table>

</td>

<!-- RIGHT -->

<td class="right">

<img

class="banner"

src="https://mercure-solo.com/signateur/assets/banner/banner.gif"

alt="Mercure Banner">

</td>

</tr>

</table>

</body>
<script src="employees.js"></script>

<script>

const params = new URLSearchParams(window.location.search);

const user = params.get("user") || "rhesa";

const emp = Employees[user];

if(emp){

document.getElementById("sig-name").textContent = emp.name;

document.getElementById("sig-title").textContent = emp.title;

document.getElementById("sig-hotel").textContent = emp.hotel;

document.getElementById("sig-address").textContent = emp.address;

document.getElementById("sig-city").textContent = emp.city;

document.getElementById("sig-phone").textContent =
"T " + emp.phone;

const email =
document.getElementById("sig-email");

email.textContent = emp.email;

email.href =
"mailto:"+emp.email;

}

</script>
</html>
